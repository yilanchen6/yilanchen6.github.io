<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
    {% seo %}
  </head>

  <body id="top">
    <a class="skip-link" href="#main_content">Skip to content</a>
    <div class="page-shell">
      <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
          {% if page.home %}
            {% assign section_prefix = '' %}
          {% else %}
            {% assign section_prefix = '/' | relative_url %}
            <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          {% endif %}
          <a href="{{ section_prefix }}#research-interests">Research</a>
          <a href="{{ section_prefix }}#publications">Publications</a>
          <a href="{{ section_prefix }}#experience">Experience</a>
          <a href="{{ section_prefix }}#contact">Contact</a>
        </nav>
      </header>
      <main id="main_content" class="content">
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>{{ site.title }}</span>
        <a href="#top">Back to top</a>
      </footer>
    </div>
  </body>
</html>
