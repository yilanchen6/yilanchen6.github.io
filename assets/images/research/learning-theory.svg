<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" role="img" aria-labelledby="title desc">
  <title id="title">Training trajectories and data-efficient learning</title>
  <desc id="desc">Two separate research directions: training trajectories inform generalization analysis, while dataset distillation compresses data into a smaller learned dataset. The trajectory is schematic, not a measured learning curve.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#245d7e" stroke-width="1.5"/></marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16">
    <text x="17" y="22" fill="#59666d">Training trajectories</text>
    <path d="M22 63C31 28 51 36 65 55S93 72 108 48S129 40 141 51" fill="none" stroke="#245d7e" stroke-width="2"/>
    <g fill="#ffffff" stroke="#245d7e" stroke-width="1.5"><circle cx="22" cy="63" r="3.5"/><circle cx="65" cy="55" r="3.5"/><circle cx="108" cy="48" r="3.5"/><circle cx="141" cy="51" r="3.5"/></g>
    <path d="M156 51H181" fill="none" stroke="#245d7e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="197" y="47" fill="#1e2b32" font-weight="600">Generalization</text>
    <text x="197" y="66" fill="#245d7e">analysis</text>
    <path d="M17 87H343" fill="none" stroke="#cbd5d9"/>
    <g fill="#f3f5f4" stroke="#cbd5d9" stroke-width="1.3">
      <circle cx="25" cy="111" r="4.5"/><circle cx="42" cy="111" r="4.5"/><circle cx="59" cy="111" r="4.5"/>
      <circle cx="25" cy="128" r="4.5"/><circle cx="42" cy="128" r="4.5"/><circle cx="59" cy="128" r="4.5"/>
      <circle cx="25" cy="145" r="4.5"/><circle cx="42" cy="145" r="4.5"/><circle cx="59" cy="145" r="4.5"/>
    </g>
    <path d="M77 128H107" fill="none" stroke="#245d7e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g fill="#245d7e" stroke="#ffffff" stroke-width="1.5"><circle cx="133" cy="116" r="6"/><circle cx="122" cy="139" r="6"/><circle cx="144" cy="139" r="6"/></g>
    <text x="197" y="124" fill="#1e2b32" font-weight="600">Dataset</text>
    <text x="197" y="143" fill="#245d7e">distillation</text>
  </g>
</svg>
