<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" role="img" aria-labelledby="title desc">
  <title id="title">Learning from teacher supervision and reward feedback</title>
  <desc id="desc">Teacher supervision and reward feedback inform token-level learning signals, which guide updates to a student policy for reasoning, coding, and agents. This is a schematic of the research direction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#245d7e" stroke-width="1.5"/></marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="12" y="20" width="104" height="45" rx="8" fill="#f3f5f4" stroke="#cbd5d9"/>
    <text x="64" y="39" fill="#1e2b32" font-weight="600">Teacher</text>
    <text x="64" y="56" fill="#245d7e">supervision</text>
    <rect x="12" y="99" width="104" height="45" rx="8" fill="#f3f5f4" stroke="#cbd5d9"/>
    <text x="64" y="118" fill="#1e2b32" font-weight="600">Reward</text>
    <text x="64" y="135" fill="#245d7e">feedback</text>
    <path d="M116 42.5H127V82H138 M116 121.5H127V82" fill="none" stroke="#245d7e" stroke-width="1.5"/>
    <circle cx="127" cy="82" r="3" fill="#245d7e"/>
    <rect x="140" y="59" width="104" height="46" rx="8" fill="#ffffff" stroke="#cbd5d9"/>
    <text x="192" y="78" fill="#1e2b32" font-weight="600">Token-level</text>
    <text x="192" y="96" fill="#245d7e">signals</text>
    <path d="M244 82H261" fill="none" stroke="#245d7e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="265" y="59" width="83" height="46" rx="8" fill="#245d7e"/>
    <text x="306.5" y="78" fill="#ffffff" font-weight="600">Student</text>
    <text x="306.5" y="96" fill="#ffffff">policy</text>
    <text x="244" y="141" fill="#59666d" font-size="15">Reasoning · Coding · Agents</text>
  </g>
</svg>
